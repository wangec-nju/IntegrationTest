name: Integration Tests

runs: 
  using: "composite"
  steps:
    - name: Test Loopback
      shell: bash
      run: ping 127.0.0.1 -c 4
    - name: Setup pytest environment
      shell: bash
      run: pip install pytest pytest-cov requests
    - name: "Run tests with pytest"
      shell: bash
      run: pytest test/intest.py
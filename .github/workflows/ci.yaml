name: Automatic Test Workflow

on: 
  push: 
  pull_request:
    branches: ["main"]

jobs:
  File Structure Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Must-Have Files
        uses: ./.github/actions/filecheck
  Style Check:
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - name: Check Code Style
        uses: ./.github/actions/stylecheck
  Unit Test:
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v5
      - name: Check Must-Have Files
        uses: ./.github/actions/filecheck
      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          python-verison: ${{matrix.python-version}}
      - name: Run Unit Tests
        uses: ./.github/actions/unitest
  Interface Test:
    runs-on: ubuntu-latest
    strategy: 
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v5
      - name: Check Must-Have Files
        uses: ./.github/actions/filecheck
      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          python-verison: ${{matrix.python-version}}
      - name: Run Integration Tests
        uses: ./.github/actions/intest